spring.application.name=erp-backend

# Secrets are never committed. Locally they are read from ERP_Backend/.env (git-ignored,
# see .env.example); in deployed environments set them as real environment variables.
spring.config.import=optional:file:.env[.properties]

# ===============================
# SUPABASE DATABASE - SESSION POOLER
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# FLYWAY - TEMPORARILY DISABLED
# ===============================
spring.flyway.enabled=false

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8082}

# ===============================
# JWT
# ===============================
# Required: at least 32 random bytes (e.g. `openssl rand -base64 48`). Startup fails without it.
app.security.jwt.secret=${JWT_SECRET}
# SRS 8.7 / 12.1: 15-minute access tokens, 7-day rotating refresh tokens.
app.security.jwt.expiration-ms=${JWT_ACCESS_TTL_MS:900000}
app.security.refresh-token.expiration-ms=${JWT_REFRESH_TTL_MS:604800000}

# ===============================
# AUTH & SESSION SECURITY (see SMARTERP_SECURITY_CONFIGURATION_GUIDE.md)
# ===============================
# Required: base64 of exactly 32 random bytes (AES-256-GCM key for TOTP secrets).
app.security.mfa.encryption-key=${MFA_ENCRYPTION_KEY}
app.security.mfa.issuer=${MFA_ISSUER:SmartERP}
# MFA is mandatory for SUPER_ADMIN and TENANT_ADMIN (master security requirement).
app.security.mfa.enforce-privileged=${MFA_ENFORCE_PRIVILEGED:true}

# Lockout: N failures within the window lock the account for the duration (SRS 11.1).
app.security.lockout.max-attempts=5
app.security.lockout.window-minutes=15
app.security.lockout.duration-minutes=15

app.security.password.history-size=5
# Have I Been Pwned k-anonymity check (only a 5-char hash prefix is sent); fail-open.
app.security.password.breach-check.enabled=${PASSWORD_BREACH_CHECK_ENABLED:true}

app.security.password-reset.ttl-minutes=30
app.security.password-reset.link-base=${PASSWORD_RESET_LINK_BASE:http://localhost:5173/reset-password}
# DEVELOPMENT ONLY: print reset links to the log until an email provider exists.
app.security.password-reset.log-links=${PASSWORD_RESET_LOG_LINKS:false}

# Refresh-token cookie. Secure must stay true outside localhost. Use SameSite=None only if the
# frontend and API are on different sites (and then keep Secure=true).
app.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Strict}

# Comma-separated list of allowed frontend origins.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ===============================
# SWAGGER (disabled unless SWAGGER_ENABLED=true; never enable publicly in production)
# ===============================
app.security.swagger.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.cubeage.erp=${APP_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=WARN

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
